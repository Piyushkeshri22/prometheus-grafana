apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: cpu-high-alert
  namespace: monitoring
  labels:
    release: monitoring

spec:
  groups:
    - name: kubernetes-cpu-alerts

      rules:

        - alert: KubernetesPodHighCPUUsageWarning

          expr: |
            (
              rate(
                container_cpu_usage_seconds_total{
                  namespace="default",
                  pod=~"cpu-stress.*"
                }[2m]
              )
              /
              on(namespace, pod)
              kube_pod_container_resource_limits{
                namespace="default",
                pod=~"cpu-stress.*",
                resource="cpu"
              }
            ) * 100 > 80

          for: 5m

          labels:
            severity: warning

          annotations:
            summary: "High CPU Usage"
            description: "Pod {{ $labels.pod }} is using more than 80% of its CPU limit."

        - alert: KubernetesPodHighCPUUsageCritical

          expr: |
            (
              rate(
                container_cpu_usage_seconds_total{
                  namespace="default",
                  pod=~"cpu-stress.*"
                }[2m]
              )
              /
              on(namespace, pod)
              kube_pod_container_resource_limits{
                namespace="default",
                pod=~"cpu-stress.*",
                resource="cpu"
              }
            ) * 100 > 90

          for: 2m

          labels:
            severity: critical

          annotations:
            summary: "Critical CPU Usage"
            description: "Pod {{ $labels.pod }} is using more than 90% of its CPU limit."