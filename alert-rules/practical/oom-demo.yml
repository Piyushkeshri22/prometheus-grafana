apiVersion: v1
kind: Pod

metadata:
  name: oom-demo

spec:
  restartPolicy: Always

  containers:
    - name: memory-hog

      image: polinux/stress

      resources:
        requests:
          memory: "32Mi"

        limits:
          memory: "64Mi"

      command:
        - stress

      args:
        - "--vm"
        - "1"
        - "--vm-bytes"
        - "128M"
        - "--vm-hang"
        - "1"