apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: memory-high-alert
  namespace: monitoring
  labels:
    release: monitoring

spec:
  groups:
    - name: kubernetes-memory-alerts
      rules:

        - alert: KubernetesPodHighMemoryUsageWarning

          expr: |
            (
              container_memory_working_set_bytes{
                namespace="default",
                pod=~"memory-stress.*"
              }
              /
              on(namespace,pod)
              kube_pod_container_resource_limits{
                namespace="default",
                pod=~"memory-stress.*",
                resource="memory"
              }
            ) * 100 > 80

          for: 3m

          labels:
            severity: warning

          annotations:
            summary: "High Memory Usage"
            description: "Pod {{ $labels.pod }} is using more than 80% of its memory limit."

        - alert: KubernetesPodHighMemoryUsageCritical

          expr: |
            (
              container_memory_working_set_bytes{
                namespace="default",
                pod=~"memory-stress.*"
              }
              /
              on(namespace,pod)
              kube_pod_container_resource_limits{
                namespace="default",
                pod=~"memory-stress.*",
                resource="memory"
              }
            ) * 100 > 90

          for: 1m

          labels:
            severity: critical

          annotations:
            summary: "Critical Memory Usage"
            description: "Pod {{ $labels.pod }} is using more than 90% of its memory limit."