apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: test-alert
  namespace: monitoring
  labels:
    release: monitoring

spec:
  groups:
    - name: test.rules
      rules:
        - alert: MyFirstPrometheusAlert
          expr: vector(0) == 1
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "My first Prometheus alert"
            description: "This alert is created for Prometheus testing."
